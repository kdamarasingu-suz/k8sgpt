# CI half of this demo: build the checkout-worker image and push it to
# GHCR, and lint the Kubernetes manifests. This workflow never touches the
# cluster - deployment is ArgoCD's job (see argocd/application.yaml).
name: ci-build-push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-build-push.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/checkout-worker:latest
            ghcr.io/${{ github.repository_owner }}/checkout-worker:${{ github.sha }}

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          for f in $(find manifests argocd -name '*.yaml'); do
            echo "Checking $f"
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))"
          done
